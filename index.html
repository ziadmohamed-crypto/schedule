<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3b53">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Level 1 Schedule</title>
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#16212b;--mute:#66737d;--line:#dde3df;--brand:#1d3b53;--acc:#e0a526;--now:#dff3e4;--r:12px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--card:#18222b;--ink:#e9eef1;--mute:#8d9ba6;--line:#2a3742;--brand:#7fb0d6;--now:#173826;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171d;--card:#18222b;--ink:#e9eef1;--mute:#8d9ba6;--line:#2a3742;--brand:#7fb0d6;--now:#173826;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Tahoma,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--brand);color:#fff}
header h1{font-size:17px;margin:0}
header small{opacity:.8;display:block;font-weight:400}
.tools{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 11px}
header button{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button.on{background:var(--acc);color:#16212b;border-color:var(--acc)}
main{flex:1;overflow:auto;padding:14px 16px 20px;max-width:1200px;width:100%;margin:0 auto}
.wrap{max-width:1200px;margin:0 auto}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;padding:13px 4px;font-weight:600;background:none;color:var(--mute)}
nav button.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--acc);background:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.days{display:flex;gap:6px;overflow-x:auto}
.item{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--c,#999);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.item.now{background:var(--now);outline:2px solid #2f9e57}
.item b{display:block}.item span{color:var(--mute);font-size:13px}
.tm{font-variant-numeric:tabular-nums;font-weight:700}
.badge{display:inline-block;background:#2f9e57;color:#fff;border-radius:99px;padding:0 8px;font-size:12px;margin-inline-start:6px}
.grid{display:none;grid-template-columns:repeat(5,1fr);gap:10px}
.col h3{margin:0 0 6px}
body.laptop .grid{display:grid}body.laptop .daylist{display:none}
body.laptop .bar .days{display:none}
body.laptop .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.row input[type=text]{flex:1;min-width:150px}
.task{display:flex;gap:10px;align-items:flex-start}.task.done .t{text-decoration:line-through;opacity:.55}
.x{margin-inline-start:auto;color:#b3261e}
.toast{position:fixed;inset-inline:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--brand);color:#fff;padding:12px 14px;border-radius:var(--r);z-index:9;box-shadow:0 6px 24px #0005;max-width:520px;margin:auto}
.lock{color:var(--mute);font-size:13px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:10px}.ccard{text-align:start;border:1px solid var(--line);border-top:6px solid var(--c);border-radius:var(--r);padding:14px 12px;display:flex;flex-direction:column;gap:2px}.ccard b{font-size:17px}.ccard span{color:var(--mute);font-size:13px}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:10}.modal[hidden]{display:none}.modal div{background:var(--card);padding:18px;border-radius:var(--r);width:min(320px,90%)}.modal input{width:100%;margin:8px 0}.trk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}.live{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}.live span,.day span{color:var(--mute);font-size:13px}.pb{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.pb i{display:block;height:100%;background:#2f9e57;border-radius:99px;transition:width .6s}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d93025;margin-inline-end:6px;animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.dot{animation:none}}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px}.chip.done{background:var(--now)}.chip.live{background:#2f9e57;color:#fff;border-color:#2f9e57}.hint{font-size:13px;color:var(--mute);margin:8px 0}.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;margin-inline-start:6px;vertical-align:middle}.tag.red{background:#fde2e0;color:#8a1c14}.tag.amber{background:#fdecc8;color:#7a4c00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.red{background:#4a1a16;color:#ffb4ac}:root:not([data-theme="light"]) .tag.amber{background:#4a3a12;color:#ffd98f}}
:root[data-theme="dark"] .tag.red{background:#4a1a16;color:#ffb4ac}:root[data-theme="dark"] .tag.amber{background:#4a3a12;color:#ffd98f}

/* UI refresh + image tasks */
button{min-height:36px}
.item{box-shadow:0 1px 2px rgba(0,0,0,.05)}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;padding:8px 4px}
nav i{font-style:normal;font-size:19px;line-height:1.2}
@media(max-width:700px){.tools{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tools>*{flex:none}}
.tform{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:14px}
.tform textarea{width:100%;margin:0 0 8px;resize:vertical}
.tform .row{margin-bottom:8px}.tform .row:last-child{margin-bottom:0;align-items:center}
.pick{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px dashed var(--brand);color:var(--brand);border-radius:8px;padding:7px 12px;font-weight:600}
.pick:focus-within,.pick:hover{background:var(--now)}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line);vertical-align:middle;margin-inline-end:8px}
#tprev{display:inline-flex;align-items:center}
.task input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:#2f9e57;flex:none}
.task .t{flex:1;min-width:0}
.tx{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.timg{display:block;max-width:100%;max-height:260px;margin-top:8px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;object-fit:cover}
.lb{position:fixed;inset:0;background:#000d;z-index:11;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb[hidden]{display:none}.lb img{max-width:100%;max-height:78%;border-radius:8px}
.lb a,.lb button{background:#fff;color:#16212b;border-radius:8px;padding:8px 16px;text-decoration:none;font-weight:600;border:0}

/* ===== UI v2 ===== */
:root{--r:14px;--hd:#1d3b53}
body{font:15px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif}
header{position:sticky;top:0;z-index:5;padding:14px 16px 12px;gap:10px;background:var(--hd);color:#fff}
header h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
header select{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3);border-radius:99px;padding:6px 12px}
header select option{color:#16212b}
.more{display:flex;gap:6px;flex-wrap:wrap;width:100%}.more[hidden]{display:none}
.toast{background:var(--hd)}
.days button{border-radius:99px;padding:6px 16px;flex:none;position:relative}
.days button.today::after{content:"";position:absolute;top:4px;inset-inline-end:7px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.days button.on.today::after{background:#16212b}
.item.lec{display:flex;padding:0;overflow:hidden}
.lt{flex:none;width:80px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--c) 16%,transparent)}
.lt b{font-size:13px}.lt span{font-size:12px}
.lb2{padding:10px 12px;min-width:0;flex:1}.lb2 span{display:block}.lb2 .x{margin-top:6px}
.trk{background:var(--hd);color:#fff;border:0;padding:14px}
.trk .live span,.trk .day span,.trk .lock{color:rgba(255,255,255,.78)}
.trk .pb{background:rgba(255,255,255,.2)}.trk .pb i{background:var(--acc)}
.trk .chip{border-color:rgba(255,255,255,.3);color:#fff}.trk .chip.done{background:rgba(255,255,255,.16)}
.trk .chip.live{background:var(--acc);color:#16212b;border-color:var(--acc)}
nav{box-shadow:0 -1px 0 var(--line)}
nav i{padding:1px 18px;border-radius:99px;transition:background .2s}
nav button.on{box-shadow:none}nav button.on i{background:var(--now)}
.seg{display:inline-flex;background:var(--line);border-radius:99px;padding:3px;gap:2px;margin:0 0 12px}
.seg button{border:0;background:none;border-radius:99px;padding:5px 16px;color:var(--mute);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.prog{margin-bottom:12px}.prog span{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
.empty{text-align:center;color:var(--mute);padding:28px 12px;border:1px dashed var(--line);border-radius:var(--r)}
.x{border-color:transparent;background:none}

.ponly{display:none}
@page{size:landscape;margin:10mm}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 html,body{height:auto;background:#fff;color:#000;display:block}
 :root{padding-top:0}
 main{overflow:visible;padding:0;max-width:none}
 header{position:static;background:none;color:#000;padding:0 0 8px;border-bottom:2px solid #1d3b53;margin-bottom:10px}
 header .tools,header .more,nav,.trk,.bar,.daylist,.toast,.lb,.modal,.x,h3+.row,.row{display:none!important}
 header small{opacity:.7}.ponly{display:block;width:100%;font-size:12px;color:#444}
 .grid{display:grid!important;grid-template-columns:repeat(5,1fr);gap:6px}
 .col h3{font-size:13px;margin:0 0 4px;padding-bottom:3px;border-bottom:1px solid #999}
 .item{break-inside:avoid;box-shadow:none;border-color:#bbb;background:#fff;margin-bottom:5px;font-size:10.5px;line-height:1.3}
 .item.now{background:#fff;outline:none}.badge{display:none!important}
 .lt{width:54px;padding:5px 3px}.lt b,.lt span{font-size:9.5px}.lb2{padding:5px 6px}
 .lb2 span,.item span{color:#333}
}

.cn{font-size:16px;line-height:1.3;margin-bottom:1px}
.lb2 .cm{font-weight:600;font-size:13px}
@media print{.cn{font-size:11.5px}.lb2 .cm{font-size:9.5px}}
</style></head>
<body>
<header>
 <h1 id="ttl">Level 1 · Communications &amp; Computer Eng.<small id="sub">Semester 1, 2026/2027</small></h1>
 <div class="tools">
  <select id="prog" aria-label="Program"><option value="L1">Level 1</option><option value="GEN">Level 0 / General</option></select>
  <select id="grp" aria-label="Group"><option>G1</option><option>G2</option></select>
  <button id="lead">Leader</button>
  <button id="more" aria-expanded="false" aria-label="More options">⚙️</button>
 </div>
 <div class="ponly" id="pinfo"></div>
 <div class="more" id="morebox" hidden>
  <button id="theme">🖥️ Auto</button>
  <button id="prt">🖨️ Print schedule</button>
  <button id="view">Laptop view</button>
  <button id="notif">Enable alerts</button>
  <button id="inst" hidden>Install app</button>
 </div>
</header>
<main id="main"></main>
<nav><button data-t="schedule" class="on"><i>📅</i>Schedule</button><button data-t="tasks"><i>✅</i>Tasks</button><button data-t="data"><i>📚</i>Data</button></nav>
<div id="lb" class="lb" hidden><img alt="Task image"><a id="lbd" download="task-image.jpg">Save image</a><button id="lbx">Close</button></div>
<div id="modal" class="modal" hidden><div role="dialog" aria-label="Leader code"><b>Leader code</b><input id="code" type="password" inputmode="numeric" placeholder="Enter code" autocomplete="off"><p id="cerr" class="lock" style="color:#b3261e" hidden>Wrong code. Try again.</p><button class="on" id="cok">Unlock</button> <button id="ccx">Cancel</button></div></div>
<div id="toast" class="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
